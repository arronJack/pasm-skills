[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pasm-skills"
version = "0.4.4"
description = "PASM 智能体基座 —— 写/跑基于 PASM 引擎的智能体：SDK（BaseAgent）+ 智能体框架 + 场景仿真 + 技能包打包工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "arronzheng" }]
keywords = [
    "pasm", "agent", "agent-framework", "agent-sdk", "cognition",
    "memory", "emotion", "long-run", "verification", "skill-package",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# 想要覆盖仿生层（情绪/人格/情景记忆）时，指向一个带 torch 的解释器即可：
#   PASM_PYTHON=/path/to/venv/bin/python pasm-skills run --all
# 或者写本机配置（在仓库外，不会入库）：
#   ~/.pasm-skills/local.json  ->  {"python": ["/path/to/python-with-torch"]}
torch = ["torch"]

[project.urls]
Homepage = "https://gitee.com/arronzheng/pasm-skills"
Repository = "https://github.com/arronJack/pasm-skills"
Source = "https://gitee.com/arronzheng/pasm-skills"
Issues = "https://gitee.com/arronzheng/pasm-skills/issues"

[project.scripts]
pasm-skills = "pasm_skills.cli:main"

[tool.setuptools]
packages = ["pasm_skills", "pasm_skills.sdk"]

[tool.setuptools.package-data]
pasm_skills = ["py.typed"]
